[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "criteo-taxonomy-classification"
version = "0.1.0"
description = "Hierarchical product categorization for the Google Product Taxonomy."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "accelerate==1.13.0",
  "huggingface-hub==1.12.2",
  "matplotlib==3.10.7",
  "numpy==2.3.4",
  "openai==2.32.0",
  "pandas==2.3.3",
  "pyarrow==22.0.0",
  "scikit-learn==1.7.2",
  "scipy==1.16.3",
  "sentence-transformers==5.3.0",
  "torch==2.9.0",
  "tqdm==4.67.1",
  "transformers==5.7.0",
  "umap-learn==0.5.9.post2",
]

[project.optional-dependencies]
local-mlx = [
  "mlx==0.31.2",
  "mlx-lm==0.31.3",
  "mlx-vlm==0.4.4",
]
dev = [
  "ipykernel==7.1.0",
]

[tool.setuptools]
py-modules = []

[tool.uv]
package = false
